name: Validate sing-box (1.14.2 baseline, 1.14.3 compatibility)
on:
  push:
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: sing-box-${{ github.ref }}
  cancel-in-progress: true
jobs:
  validate:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-14]
        core: ['1.14.2', '1.14.3']
    env:
      SING_BOX_VERSION: ${{ matrix.core }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Script and routing regressions
        run: npm test
      - name: Seed publication failures
        run: python -m unittest discover -s tests -p '*_test.py' -v
      - name: Download pinned official core
        run: python scripts/download-core.py
      - name: Check complete generated configurations
        run: npm run test:core
      - name: DNS, detour outage, FakeIP and remote rule cache integration
        if: runner.os == 'Linux'
        run: python tests/runtime.py
      - name: Decode and validate actual upstream rule seeds
        if: runner.os == 'Linux'
        run: |
          python scripts/prepare-rule-seeds.py --config config_tun.json --output .test-output/real-seeds --core "$SING_BOX"
          python tests/upstream-rules.py --seeds .test-output/real-seeds --core "$SING_BOX"
      - name: VPS policy cold and warm cache A/B (synthetic network)
        if: runner.os == 'Linux'
        run: python tests/vps-performance.py
